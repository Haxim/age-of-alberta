<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Age of Alberta" />

<!-- Open Graph (Facebook, LinkedIn, Slack, Discord, iMessage…) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Age of Alberta" />
<meta property="og:title" content="Age of Alberta — Learn. Build. Thrive." />
<meta property="og:description" content="A free learning game built on the real Alberta K–12 curriculum. Answer questions to grow your Alberta village — math, spelling, reading & social studies, plus printable worksheets." />
<meta property="og:url" content="https://ageofalberta.fun/" />
<meta property="og:image" content="https://ageofalberta.fun/og-image.jpg" />
<meta property="og:image:secure_url" content="https://ageofalberta.fun/og-image.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Age of Alberta — Learn. Build. Thrive." />
<meta name="twitter:description" content="A free learning game built on the real Alberta K–12 curriculum. Grow your Alberta village by answering math, spelling, reading & social-studies questions." />
<meta name="twitter:image" content="https://ageofalberta.fun/og-image.jpg" />
<meta name="twitter:image:alt" content="Age of Alberta — the Alberta Legislature dome beneath the Rockies." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2433; --sky1:#8fd0ef; --sky2:#cdeefb;
    --gold:#e7b54a; --gold-d:#b8860b; --green:#3f8d4f; --green-d:#2c6b3a;
    --blue:#2f6db0; --blue-d:#1f4e84; --purple:#6a4fa0; --panel:#fffaf0;
    --grass:#7fb069; --water:#5aa9d6; --field:#dcc06a; --rock:#9b9387;
    --good:#3aa655; --bad:#d9544f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(#7cc4e6,#bfe8f7);}
  #game{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
    padding:10px 12px;pointer-events:none;flex-wrap:wrap;z-index:20;}
  .res{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);
    border:3px solid #00000018;border-radius:16px;padding:6px 12px;font-family:'Baloo 2';font-weight:700;
    font-size:18px;box-shadow:0 4px 0 #00000022;}
  .res .ic{font-size:20px}
  .grow{flex:1}
  .pill{pointer-events:auto;background:linear-gradient(#fff,#ffe9b8);border:3px solid var(--gold-d);
    border-radius:16px;padding:6px 14px;font-family:'Baloo 2';font-weight:800;color:#7a5a10;
    box-shadow:0 4px 0 #00000022;}

  /* ---------- Bottom dock ---------- */
  #dock{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;
    padding:12px;z-index:20;pointer-events:none;flex-wrap:wrap;}
  .btn{pointer-events:auto;cursor:pointer;font-family:'Baloo 2';font-weight:800;font-size:18px;color:#fff;
    border:none;border-radius:18px;padding:14px 22px;box-shadow:0 5px 0 #0006, 0 8px 14px #0003;
    transition:transform .07s, box-shadow .07s;user-select:none;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0006;}
  .btn.green{background:linear-gradient(#5cb56b,var(--green));}
  .btn.blue{background:linear-gradient(#4f93d6,var(--blue));}
  .btn.gold{background:linear-gradient(#f2c75c,var(--gold-d));color:#3d2c05;}
  .btn.purple{background:linear-gradient(#8a6cc4,var(--purple));}
  .btn.teal{background:linear-gradient(#3fb6ad,#1f7d77);}
  .btn .ic{font-size:22px}

  /* ---------- Overlay / Modal ---------- */
  .overlay{position:fixed;inset:0;background:#0b1a2cc4;display:flex;align-items:center;justify-content:center;
    z-index:60;padding:16px;backdrop-filter:blur(3px);animation:fade .2s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .card{background:var(--panel);border:5px solid #fff;border-radius:26px;max-width:540px;width:100%;
    box-shadow:0 18px 0 #00000030, 0 24px 60px #0007;animation:pop .22s cubic-bezier(.2,1.4,.4,1);
    max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
  .card .top{padding:14px 20px;color:#fff;font-family:'Baloo 2';font-weight:800;
    display:flex;align-items:center;gap:10px;font-size:21px;flex:0 0 auto;}
  .card .body{padding:16px 20px;overflow:auto;flex:1 1 auto;}
  .card .foot{flex:0 0 auto;padding:12px 20px;border-top:2px solid #00000010;background:#fffdf5;
    display:flex;gap:10px;}
  .card .foot .btn{flex:1;padding:14px;font-size:18px;justify-content:center;}
  .btn.skip{background:linear-gradient(#cdbfa3,#9a8a6a);}
  .subjectMath{background:linear-gradient(#4f93d6,var(--blue-d));}
  .subjectSpelling{background:linear-gradient(#8a6cc4,#4a3478);}
  .subjectReading{background:linear-gradient(#5cb56b,var(--green-d));}
  .subjectSocial{background:linear-gradient(#e08a3c,#a85618);}

  /* hero story modal */
  .heroimg{width:auto;max-width:300px;max-height:44vh;border-radius:18px;border:4px solid #fff;
    box-shadow:0 8px 24px #0003;margin:4px auto 14px;display:block;}
  .herostory{font-size:18px;line-height:1.45;font-weight:500;text-align:left;margin:0;}
  /* railway control buttons */
  .trainbtns{display:flex;gap:8px;}
  .trainbtns .btn{flex:1;font-size:15px;line-height:1.15;padding:10px 6px;text-align:center;}
  .trainbtns .btn small{font-weight:600;opacity:.85;font-size:12px;}

  .qprompt{font-size:23px;font-weight:600;line-height:1.3;margin:0 0 4px;}
  .qmath{font-family:'Baloo 2';font-weight:800;font-size:46px;text-align:center;letter-spacing:1px;
    color:var(--blue-d);margin:4px 0 10px;}
  .passage{background:#fff;border:3px dashed #cdb98a;border-radius:16px;padding:12px 14px;font-size:18px;
    line-height:1.45;margin-bottom:10px;}
  .hintword{font-family:'Baloo 2';font-weight:800;font-size:30px;text-align:center;color:var(--purple);}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  .choice{cursor:pointer;background:#fff;border:3px solid #d9cdb0;border-radius:16px;padding:16px;font-size:22px;
    font-weight:600;text-align:center;transition:transform .07s, border-color .1s, background .1s;
    box-shadow:0 4px 0 #00000018;}
  .choice:active{transform:translateY(3px);}
  .choice.correct{background:#d7f6dd;border-color:var(--good);}
  .choice.wrong{background:#ffdedc;border-color:var(--bad);}

  .typed{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;}
  .typed input{font-family:'Baloo 2';font-weight:800;font-size:30px;text-align:center;width:200px;max-width:60vw;
    padding:10px;border:3px solid #d9cdb0;border-radius:16px;outline:none;background:#fff;color:var(--ink);}
  .typed input:focus{border-color:var(--blue);}
  /* cheat-code box in the Town Hall popup — same outline as the quiz box */
  .cheat-in{font-family:'Baloo 2';font-weight:800;font-size:18px;text-align:center;width:160px;max-width:55vw;
    padding:10px 12px;border:3px solid #d9cdb0;border-radius:16px;outline:none;background:#fff;color:var(--ink);}
  .cheat-in:focus{border-color:var(--blue);}

  /* On-screen keypad / letters */
  .pad{display:grid;gap:7px;margin-top:10px;margin-bottom:6px;}
  .padnum{grid-template-columns:repeat(3,1fr);max-width:300px;margin:10px auto 0;}
  .key{cursor:pointer;background:linear-gradient(#fff,#f0e8d4);border:3px solid #d9cdb0;border-radius:14px;
    font-family:'Baloo 2';font-weight:800;font-size:24px;padding:11px 0;text-align:center;
    box-shadow:0 4px 0 #00000018;user-select:none;}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 #00000018;}
  .key.wide{grid-column:span 1;}
  .key.act{background:linear-gradient(#5cb56b,var(--green));color:#fff;border-color:var(--green-d);}
  .key.del{background:linear-gradient(#f0a3a0,#d9544f);color:#fff;border-color:#a83c38;}
  .padletters{grid-template-columns:repeat(9,1fr);gap:5px;}
  .padletters .key{font-size:18px;padding:9px 0;}

  .submit{margin-top:16px;width:100%;}
  .fb{font-family:'Baloo 2';font-weight:800;font-size:22px;text-align:center;margin-top:12px;min-height:28px;}
  .fb.good{color:var(--good);} .fb.bad{color:var(--bad);}
  .reward{display:flex;gap:14px;justify-content:center;margin-top:8px;font-family:'Baloo 2';font-weight:800;font-size:20px;}
  .outcome{font-size:13px;color:#9b8a63;margin-top:14px;text-align:center;font-family:'Fredoka';}

  /* Build menu */
  .buildgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .bcard{background:#fff;border:3px solid #e3d8bd;border-radius:18px;padding:14px;text-align:center;cursor:pointer;
    box-shadow:0 4px 0 #00000014;transition:transform .07s;}
  .bcard:active{transform:translateY(3px);}
  .bcard .emoji{font-size:40px;}
  .bcard h4{font-family:'Baloo 2';margin:6px 0 2px;font-size:18px;}
  .bcard .cost{font-weight:600;font-size:14px;color:#7a6a45;}
  .bcard.locked{opacity:.5;filter:grayscale(.6);}

  /* Subject picker (Learn) */
  .pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pcard{background:#fff;border:3px solid #e3d8bd;border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;
    box-shadow:0 4px 0 #00000014;transition:transform .07s, border-color .1s, background .12s;}
  .pcard:active{transform:translateY(3px);}
  .pcard .emoji{font-size:42px;line-height:1;}
  .pcard h4{font-family:'Baloo 2';margin:8px 0 2px;font-size:19px;}
  .pcard p{margin:0;font-size:13px;color:#7a6a45;}
  .pcard.pMath{border-color:#9cc3ec;background:linear-gradient(#ffffff,#eaf3fc);}
  .pcard.pMath:active{background:#dceafa;}
  .pcard.pSpell{border-color:#c2aee6;background:linear-gradient(#ffffff,#f2ecfb);}
  .pcard.pSpell:active{background:#e7ddf7;}
  .pcard.pRead{border-color:#a7d8b2;background:linear-gradient(#ffffff,#e9f6ed);}
  .pcard.pRead:active{background:#d9f0e0;}
  .pcard.pSocial{border-color:#eec59a;background:linear-gradient(#ffffff,#fdeedd);}
  .pcard.pSocial:active{background:#fbe0c4;}
  .pcard.pSurprise{border-color:var(--gold);background:linear-gradient(#ffffff,#fff3d6);}
  .pcard.pSurprise:active{background:#ffe9b8;}

  /* Title / splash */
  #splash{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    background:#0b1a2c;background-size:cover;background-position:center top;}
  #splash .veil{position:absolute;inset:0;background:linear-gradient(#0b1a2c00 40%,#0b1a2cf2 88%);}
  #splash .inner{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);text-align:center;color:#fff;
    padding:22px 26px;animation:pop .4s ease;background:rgba(12,22,38,.72);border:2px solid #ffffff2e;
    border-radius:24px;backdrop-filter:blur(4px);box-shadow:0 16px 50px #000a;max-width:90vw;}
  #splash .sub{font-family:'Baloo 2';font-size:clamp(18px,3.6vw,26px);font-weight:800;margin:0 0 16px;
    color:#ffe7a8;text-shadow:0 2px 6px #000;}
  #splash .gold{color:var(--gold);}
  .name-in{font-family:'Baloo 2';font-weight:700;font-size:22px;text-align:center;padding:12px 16px;border-radius:16px;
    border:3px solid #ffffff66;background:#ffffff22;color:#fff;outline:none;width:280px;max-width:80vw;}
  .name-in::placeholder{color:#ffffffaa;}
  .start{margin-top:18px;display:flex;justify-content:center;}
  #btnStart{justify-content:center;}
  #btnStart{background:linear-gradient(#ffd45e,#d98e12);color:#3a2700;border:3px solid #fff7;
    text-shadow:0 1px 0 #fff6;box-shadow:0 6px 0 #7a4f08,0 10px 22px #0007;}

  /* Level select */
  .levels{display:flex;flex-direction:column;gap:10px;}
  .lvl{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #e3d8bd;border-radius:16px;
    padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 #00000014;}
  .lvl.locked{opacity:.45;}
  .lvl .num{font-family:'Baloo 2';font-weight:800;font-size:26px;width:46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(#5cb56b,var(--green));}
  .lvl .meta{flex:1}
  .lvl .meta h4{margin:0;font-family:'Baloo 2';font-size:18px;}
  .lvl .meta p{margin:2px 0 0;font-size:13px;color:#7a6a45;}
  .stars{font-size:18px;color:var(--gold);}

  .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#fffef7;border:3px solid var(--gold);
    color:#6a4f10;font-family:'Baloo 2';font-weight:800;padding:10px 18px;border-radius:16px;z-index:70;
    box-shadow:0 6px 0 #00000022;animation:pop .25s ease;}
  .ghost{position:absolute;font-family:'Baloo 2';font-weight:800;font-size:26px;pointer-events:none;z-index:50;
    animation:rise 1s ease forwards;}
  @keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
  .x{position:absolute;top:10px;right:14px;font-size:26px;cursor:pointer;color:#fff;opacity:.9;}
  .helper{font-size:14px;color:#7a6a45;text-align:center;margin-top:6px;}
  @media(max-width:480px){ .choices{grid-template-columns:1fr 1fr} .qmath{font-size:44px} }

  /* ---------- Zoom controls ---------- */
  #zoomCtl{position:fixed;right:12px;bottom:84px;display:flex;flex-direction:column;gap:8px;z-index:20;}
  .zbtn{pointer-events:auto;cursor:pointer;width:46px;height:46px;border-radius:14px;border:3px solid #00000022;
    background:linear-gradient(#fffaf0,#ffe9b8);color:#7a5a10;font-family:'Baloo 2';font-weight:800;font-size:24px;
    box-shadow:0 4px 0 #00000022;display:flex;align-items:center;justify-content:center;user-select:none;}
  .zbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #00000022;}

  /* ---------- Place / explore banner ---------- */
  #placeBanner{position:fixed;left:50%;top:64px;transform:translateX(-50%);display:none;align-items:center;
    background:#fffef7;border:3px solid var(--gold);color:#6a4f10;font-family:'Baloo 2';font-weight:800;
    padding:8px 12px 8px 16px;border-radius:18px;z-index:30;box-shadow:0 6px 0 #00000022;max-width:92vw;
    font-size:15px;text-align:center;}
  #placeBanner.show{display:flex;animation:pop .25s ease;}

  /* ---------- Splash background ---------- */
  #splash{background-image:url('splash.jpg');}

  /* ---------- Worker job bubble ---------- */
  .reading-q{font-size:17px;line-height:1.4;}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="res"><span class="ic">🍓</span><span id="rFood">0</span></div>
  <div class="res"><span class="ic">🪵</span><span id="rWood">0</span></div>
  <div class="res"><span class="ic">💎</span><span id="rCrystal">0</span></div>
  <div class="grow"></div>
  <div class="pill">⭐ <span id="rScore">0</span></div>
  <div class="pill" id="levelPill">Level 1</div>
</div>

<div id="dock">
  <button class="btn green" id="btnLearn"><span class="ic">📖</span> Learn &amp; Earn</button>
  <button class="btn gold" id="btnBuild"><span class="ic">🔨</span> Build</button>
  <button class="btn blue" id="btnExplore"><span class="ic">🧭</span> Explore</button>
  <button class="btn purple" id="btnProgress"><span class="ic">🏅</span> Progress</button>
  <button class="btn teal" id="btnSheets"><span class="ic">📄</span> Worksheets</button>
</div>

<div id="zoomCtl">
  <button class="zbtn" id="zIn">+</button>
  <button class="zbtn" id="zOut">−</button>
  <button class="zbtn" id="zHome">⌂</button>
  <button class="zbtn" id="zShot" title="Save a picture">📷</button>
</div>

<div id="placeBanner"><span id="placeText">Tap a green tile to place your building</span>
  <button class="btn skip" id="placeCancel" style="padding:8px 16px;font-size:15px;margin-left:10px">Cancel</button></div>

<div id="splash">
  <div class="veil"></div>
  <div class="inner">
    <div class="sub">Learn · Build · Thrive — turn learning into legacy</div>
    <input class="name-in" id="nameIn" placeholder="Type your name, explorer!" maxlength="14" />
    <div class="start"><button class="btn" id="btnStart" style="font-size:24px;padding:16px 34px;">▶ Start Adventure</button></div>
    <div class="helper" style="color:#ffffffdd;margin-top:14px;">Answer questions to grow your Alberta village. Built on the real Grade 2 &amp; 3 curriculum.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="worksheets.js"></script>
<script src="engine.js"></script>
</body>
</html>
